name: 更新直播源并发布

# 每天 UTC 00:00（北京时间 08:00）自动跑一次；也支持手动触发
on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时一次，保证"实时更新"体感
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行聚合脚本
        run: python aggregate.py

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 回写 summary 到仓库（可选，便于在 README 展示）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/summary.json out/UNSUPPORTED.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update playlist $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
