# XcodeGen 工程描述：在 Mac 上跑 `xcodegen generate` 即可生成 HomeIPTV.xcodeproj
# 不用手动 New Project，不用拖文件，一行命令出工程
name: HomeIPTV
options:
  bundleIdPrefix: com.dushu.homeiptv
  deploymentTarget:
    tvos: "16.0"
  developmentLanguage: zh-Hans

schemes:
  HomeIPTV:
    build:
      targets:
        HomeIPTV: all
      parallelizeBuild: true
    test:
      gatherLogsAfterCommandFailed: true

targets:
  HomeIPTV:
    type: application
    platform: tvOS
    sources:
      - path: swift
        excludes: [Info.plist]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: HomeIPTV
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dushu.homeiptv
        PRODUCT_NAME: "$(TARGET_NAME)"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        ALWAYS_SEARCH_USER_PATHS: "NO"
        TARGETED_DEVICE_FAMILY: "3"
        SDKROOT: appletvos
        SUPPORTED_PLATFORMS: appletvos appletvsimulator
